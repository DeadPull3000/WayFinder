<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Wayfinder</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <header>
                <div class="logo-icon">☀️</div>
                <h1>Thermal Wayfinder</h1>
            </header>
            
            <div class="controls-section">
                <h2>Route Planning</h2>
                <p class="instructions">Click on the map to set your start and end points.</p>
                
                <div class="input-group">
                    <label>Start Location</label>
                    <input type="text" id="start-input" placeholder="Click map to set start..." readonly>
                </div>
                
                <div class="input-group">
                    <label>End Location</label>
                    <input type="text" id="end-input" placeholder="Click map to set end..." readonly>
                </div>
                
                <button id="find-routes-btn" disabled>Find Routes</button>
                <button id="clear-btn">Clear Map</button>
            </div>
            
            <div class="metrics-section" id="metrics-container" style="display: none;">
                <h2>Route Options</h2>
                
                <div class="route-card fastest">
                    <h3>Fastest Route</h3>
                    <div class="metric"><span>Time:</span> <span id="fastest-time">--</span></div>
                    <div class="metric"><span>Heat Exposure:</span> <span id="fastest-heat">--</span></div>
                </div>
                
                <div class="route-card balanced">
                    <h3>Balanced Route</h3>
                    <div class="metric"><span>Time:</span> <span id="balanced-time">--</span></div>
                    <div class="metric"><span>Heat Exposure:</span> <span id="balanced-heat">--</span></div>
                </div>
                
                <div class="route-card coolest">
                    <h3>Coolest Route</h3>
                    <div class="metric"><span>Time:</span> <span id="coolest-time">--</span></div>
                    <div class="metric"><span>Heat Exposure:</span> <span id="coolest-heat">--</span></div>
                </div>
            </div>
        </aside>
        
        <!-- Map Container -->
        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
